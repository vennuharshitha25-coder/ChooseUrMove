<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChooseUrMove - Smart & Safe Navigation</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">
        <i class="fas fa-moon"></i>
    </button>

    <!-- Offline Alert -->
    <div class="offline-alert" id="offlineAlert">
        <i class="fas fa-wifi-slash"></i> You're offline
    </div>

    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-route"></i> ChooseUrMove</h1>
        <p>Smart routes for safer travel</p>
    </div>

    <!-- Auth Container -->
    <div class="auth-container" id="authContainer">
        <div id="loginForm">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <p style="text-align: center; margin-top: 1rem; color: var(--text-light);">
                Don't have an account? 
                <a href="#" onclick="showSignup()" style="color: var(--primary); font-weight: 600;">Sign up</a>
            </p>
        </div>

        <div id="signupForm" class="hidden">
            <h2><i class="fas fa-user-plus"></i> Sign Up</h2>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="signupName" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Emergency Contact 1 <span style="color: red;">*</span></label>
                <input type="tel" id="contact1" placeholder="+1 234 567 8900" required>
            </div>
            <div class="form-group">
                <label>Emergency Contact 2 <span style="color: red;">*</span></label>
                <input type="tel" id="contact2" placeholder="+1 234 567 8901" required>
            </div>
            <div class="form-group">
                <label>Emergency Contact 3 <span style="color: red;">*</span></label>
                <input type="tel" id="contact3" placeholder="+1 234 567 8902" required>
            </div>
            <button class="btn btn-primary" onclick="signup()">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
            <p style="text-align: center; margin-top: 1rem; color: var(--text-light);">
                Already have an account? 
                <a href="#" onclick="showLogin()" style="color: var(--primary); font-weight: 600;">Login</a>
            </p>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-app" id="mainApp">
        <div class="input-section">
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Starting Point</label>
                <input type="text" id="source" placeholder="e.g., Home, 123 Main St" value="Current Location">
            </div>
            <div class="form-group">
                <label><i class="fas fa-flag-checkered"></i> Destination</label>
                <input type="text" id="destination" placeholder="e.g., Office, 456 Oak Ave" required>
            </div>
            <button class="btn btn-primary find-routes-btn" onclick="findRoutes()">
                <i class="fas fa-search"></i> Find Routes
            </button>
        </div>

        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
            <button class="btn btn-outline" onclick="showAIHelp()" style="width: auto; padding: 12px 24px;">
                <i class="fas fa-robot"></i> AI Route Helper
            </button>
            <button class="btn btn-success" onclick="showAllRoutes()" style="width: auto; padding: 12px 24px;">
                <i class="fas fa-list"></i> Show All Routes
            </button>
        </div>

        <div class="routes-container" id="routesContainer">
            <!-- Routes will be generated here -->
        </div>
    </div>

    <!-- AI Help Modal -->
    <div class="ai-modal" id="aiModal">
        <div class="ai-modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="color: var(--primary);"><i class="fas fa-robot"></i> AI Route Assistant</h2>
                <button class="btn btn-outline" onclick="closeAIHelp()" style="width: auto; padding: 8px 16px;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="aiQuestions"></div>
            <div id="aiResult" class="hidden"></div>
        </div>
    </div>

    <!-- Emergency Button -->
    <button class="emergency-btn" id="emergencyBtn" title="Emergency SOS" onclick="triggerEmergency()">
        <i class="fas fa-exclamation-triangle"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
